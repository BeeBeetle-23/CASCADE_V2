<rect width="1000" height="330" rx="18" fill="url(#dots)" opacity="0.55"/>
<rect x="0.5" y="0.5" width="999" height="329" rx="18" fill="none" stroke="#26325A"/>

<rect width="1000" height="330" rx="18" fill="url(#g1)"/><rect width="1000" height="330" rx="18" fill="url(#g2)"/>
<text x="48" y="70" font-size="11.5" fill="#22D3EE" font-weight="700" text-anchor="start" letter-spacing="2.2">HACKATHON PROJECT  /  DECISION SUPPORT FOR COMMERCIAL LENDING</text>
<text x="44" y="160" font-size="92" fill="url(#wm)" font-weight="800" text-anchor="start" letter-spacing="5">CASCADE</text>
<text x="48" y="200" font-size="22" fill="#E6EAF7" font-weight="600" text-anchor="start" >The Underwriting Document Cascade Engine</text>
<text x="48" y="250" font-size="27" font-weight="800"><tspan fill="#A78BFA">The LLM perceives.</tspan><tspan fill="#22D3EE" dx="14">Code decides.</tspan></text>
<text x="48" y="285" font-size="15" fill="#8B97BE" font-weight="400" text-anchor="start" >Upload loan documents. Get a recommendation you can trace, retract and explain.</text>
